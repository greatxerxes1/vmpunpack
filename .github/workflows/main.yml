name: Build vmpunpack EXE (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller wheel
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Run Project Setup
      run: |
        ./setup.cmd

    - name: Build EXE with PyInstaller Directory Mode
      run: |
        pyinstaller --noconfirm vmpunpack.py

    - name: Copy Emulator Assets to Dist
      run: |
        if (Test-Path "sogen_engine") { Copy-Item -Path "sogen_engine" -Destination "dist/vmpunpack/sogen_engine" -Recurse -Force }
        if (Test-Path "engine") { Copy-Item -Path "engine" -Destination "dist/vmpunpack/engine" -Recurse -Force }

    - name: Upload Compiled Artifact Folder
      uses: actions/upload-artifact@v4
      with:
        name: vmpunpack-compiled-suite
        path: dist/vmpunpack/
