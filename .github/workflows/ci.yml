name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.13"]

    steps:
      # Shallow, and no LFS: the suites drive synthetic PEs, so neither the engine
      # nor the emulation root is needed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python -m compileall -q vmpunpack tests

      - name: Regression suite
        run: python tests/run_tests.py

      - name: Regression suite (verification gaps)
        run: python tests/run_tests2.py

      - name: Launcher suite
        shell: pwsh
        run: ./tests/launcher.ps1

  setup-check:
    name: setup --check reports a missing engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Nothing is fetched here: this asserts the tool says so clearly instead of failing obscurely.
      - name: setup_engine --check on a bare checkout
        shell: pwsh
        run: |
          $out = python vmpunpack/setup_engine.py --check 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -eq 0) { throw "--check should fail on a checkout with no engine" }
          if ($out -notmatch 'analyzer\.exe') { throw "--check should name the missing analyzer" }
          # --check is expected to exit 1 here; do not let that become the step's status
          exit 0
