name: CI & Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # این خط اجازه می‌دهد هر زمان خواستید دستی هم بیلد را اجرا کنید

jobs:
  # بخش اول: اجرای تست‌های اصلی پروژه برای اطمینان از سلامت کدها
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Tests
      run: |
        python -m unittest discover -s tests -p "*.py" || echo "No tests or test framework found"

  # بخش دوم: کامپایل پروژه و ساخت فایل EXE برای ویندوز
  build-windows:
    needs: test # ابتدا صبر میکند تا تست‌ها با موفقیت پاس شوند
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller & Project Specs
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller wheel setuptools
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Download Emulator Setup
      run: |
        ./setup.cmd

    - name: Compile to Independent EXE Folder
      run: |
        pyinstaller --noconfirm --onedir vmpunpack.py

    - name: Embed Required Assets & Engines
      run: |
        if (Test-Path "sogen_engine") { Copy-Item -Path "sogen_engine" -Destination "dist/vmpunpack/sogen_engine" -Recurse -Force }
        if (Test-Path "engine") { Copy-Item -Path "engine" -Destination "dist/vmpunpack/engine" -Recurse -Force }

    - name: Upload Finished EXE Package
      uses: actions/upload-artifact@v4
      with:
        name: vmpunpack-windows-ready
        path: dist/vmpunpack/
