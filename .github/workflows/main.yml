name: CI & Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f vmpunpack/requirements.txt ]; then pip install -r vmpunpack/requirements.txt; fi
    - name: Run Tests
      run: |
        python -m unittest discover -s tests -p "*.py" || python -m unittest discover -s vmpunpack/tests -p "*.py" || echo "No tests found"

  build-windows:
    needs: test
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller & Project Specs
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller wheel setuptools
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        if (Test-Path "vmpunpack/requirements.txt") { pip install -r vmpunpack/requirements.txt }

    - name: Download Emulator Setup
      run: |
        if (Test-Path "setup.cmd") {
            ./setup.cmd
        } elseif (Test-Path "vmpunpack/setup.cmd") {
            cd vmpunpack
            ./setup.cmd
        }

    - name: Compile to Independent EXE Folder
      run: |
        if (Test-Path "vmpunpack.py") {
            pyinstaller --noconfirm --onedir vmpunpack.py
        } elseif (Test-Path "vmpunpack/vmpunpack.py") {
            pyinstaller --noconfirm --onedir vmpunpack/vmpunpack.py
        }

    - name: Embed Required Assets & Engines
      run: |
        if (Test-Path "sogen_engine") { Copy-Item -Path "sogen_engine" -Destination "dist/vmpunpack/sogen_engine" -Recurse -Force }
        if (Test-Path "vmpunpack/sogen_engine") { Copy-Item -Path "vmpunpack/sogen_engine" -Destination "dist/vmpunpack/sogen_engine" -Recurse -Force }
        if (Test-Path "engine") { Copy-Item -Path "engine" -Destination "dist/vmpunpack/engine" -Recurse -Force }
        if (Test-Path "vmpunpack/engine") { Copy-Item -Path "vmpunpack/engine" -Destination "dist/vmpunpack/engine" -Recurse -Force }

    - name: Upload Finished EXE Package
      uses: actions/upload-artifact@v4
      with:
        name: vmpunpack-windows-ready
        path: dist/vmpunpack/
